<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ERA 30 — Pool After Dark</title>
  <meta name="description" content="A private invitation to ERA 30: Pool After Dark — October 3, Houston, Texas.">
  <meta name="theme-color" content="#030a12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <main class="poster" aria-label="ERA 30 Pool After Dark invitation">
    <img class="poster-art" src="era30-approved-master.webp" alt="ERA 30 Pool After Dark, October 3 in Houston, Texas" width="1024" height="1536" fetchpriority="high">
    <section class="countdown" id="countdown" aria-label="Countdown to October 3, 2026">
      <div><b id="cd-days">--</b><span>DAYS</span></div>
      <div><b id="cd-hrs">--</b><span>HRS</span></div>
      <div><b id="cd-min">--</b><span>MIN</span></div>
      <div><b id="cd-sec">--</b><span>SEC</span></div>
    </section>
    <section class="rsvp-layer" id="rsvp-section" aria-label="RSVP form">
      <div id="rsvp-intro" class="sr-only">You're on the list. Drop your information below to secure your spot.</div>
      <form id="rsvp-form" novalidate>
        <div class="hp-field" aria-hidden="true"><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <label class="field field-name"><span class="sr-only">First and last name</span><input id="name" name="name" type="text" maxlength="80" autocomplete="name" placeholder="First & Last Name" required></label>
        <label class="field field-phone"><span class="sr-only">Mobile number</span><input id="phone" name="phone" type="tel" maxlength="16" inputmode="tel" autocomplete="tel" placeholder="(832) 555-1234" required></label>
        <div class="guest-counter" aria-label="Number of guests">
          <button type="button" id="gc-minus" aria-label="Decrease guest count">−</button>
          <b id="gc-value" aria-live="polite">1</b>
          <input type="hidden" id="guest-count" name="guest_count" value="1">
          <button type="button" id="gc-plus" aria-label="Increase guest count">+</button>
        </div>
        <textarea id="notes" name="notes" class="sr-only" maxlength="500" tabindex="-1"></textarea>
        <p id="form-error" class="form-error" role="alert"></p>
        <button class="cta" id="cta-btn" type="submit"><span class="cta-text">SECURE MY SPOT</span><span class="cta-loading">SAVING…</span></button>
      </form>
      <div class="confirmation" id="confirmation" aria-hidden="true">
        <h2>YOU’RE IN</h2>
        <p>Your spot for <strong>ERA 30: Pool After Dark</strong> is confirmed.</p>
        <p>October 3 · Houston, Texas</p>
        <p>The hotel address and arrival instructions will be released to confirmed guests.</p>
        <a href="sms:8325890424">TEXT THE HOST</a>
        <div class="conf-actions"><button type="button" id="btn-calendar">ADD TO CALENDAR</button><button type="button" id="btn-share">SHARE</button></div>
      </div>
    </section>
    <nav class="poster-actions" aria-label="Event actions">
      <button id="action-share" type="button" aria-label="Share this event"></button>
      <button id="action-calendar" type="button" aria-label="Add to calendar"></button>
      <a href="sms:8325890424" aria-label="Text the host"></a>
      <span aria-hidden="true"></span>
    </nav>
  </main>
  <div class="background-music" aria-hidden="true"><div id="background-music-player"></div></div>
  <button type="button" class="music-toggle" id="music-toggle" aria-label="Mute background music" title="Mute background music"><span aria-hidden="true">♪</span></button>
  <script src="script.js" defer></script>
</body>
</html>
